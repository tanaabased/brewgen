name: Release Tests

on:
  pull_request:

permissions:
  contents: read

env:
  STAMPED_VERSION: v9.9.9-ci.${{ github.event.pull_request.head.sha }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Prepare release-shaped build
        uses: tanaabased/prepare-release-action@v1
        with:
          version: dev
          sync: false
          commands: |
            bun run lint
            bun run build
            version-injector dist/brewgen.sh --style sh --version "${{ env.STAMPED_VERSION }}"

      - name: Verify stamped release entrypoint
        shell: bash
        run: |
          actual="$(bash ./dist/brewgen.sh --version)"
          printf 'actual=%s\n' "$actual"
          test "$actual" = "${{ env.STAMPED_VERSION }}"

      - name: Validate repository publication
        uses: tanaabased/actions/publish-repo@v1
        with:
          dry-run: true
          version: ${{ env.STAMPED_VERSION }}
          release-date: 2026-09-19T00:00:00Z
          release-url: https://example.invalid/releases/test
          commands: |
            bun install --frozen-lockfile --ignore-scripts
            bun run lint
            bun run build
            version-injector dist/brewgen.sh --style sh --version "${{ env.STAMPED_VERSION }}"
